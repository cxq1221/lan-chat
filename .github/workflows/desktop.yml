name: Desktop apps
on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run desktop:smoke
      - run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged macOS app
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          app=$(find dist -path '*/Contents/MacOS/同频' -type f | head -1)
          node desktop/check.cjs "$app"
      - name: Check packaged Windows app
        if: matrix.platform == 'win'
        run: node desktop/check.cjs "dist/win-unpacked/同频.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --title "同频 $GITHUB_REF_NAME" --notes "Windows 与 macOS 桌面服务端。双击启动，浏览器访问即可聊天和分享文件。安装包未配置商业签名或 Apple 公证，系统可能提示来源未验证。"
