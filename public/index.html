<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>同频 · 局域网群聊</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><main class="shell"><aside><a class="brand" href="/" aria-label="同频首页"><span class="logo">≋</span>同频<span class="brand-en">LOCAL CHAT</span></a><div class="aside-body"><div class="eyebrow">你的聊天空间</div><div class="room"><span>#</span><div>公共聊天室<small>在同一个网络，聊在一起</small></div><span class="room-dot"></span></div><div class="aside-note"><span class="note-icon">↗</span><h2>打开，就聊。</h2><p>把当前网址分享给同一局域网的人，大家就能在这里相遇。</p></div></div><div class="identity" id="identity"><span class="avatar blue">·</span><div><strong>正在分配身份</strong><small>你的自动昵称</small></div></div></aside><section class="chat"><header><div><div class="eyebrow">一起在线</div><h1>公共聊天室 <span>LAN</span></h1></div><div class="connection"><span id="status-dot"></span><span id="status">正在连接</span><i></i><span id="online">— 人在线</span></div></header><div class="desktop-access" id="desktop-access" hidden><strong>局域网访问地址</strong><div id="desktop-address-list"></div></div><div class="history-note"><span>◷</span> 消息和文件保留 7 天 <span class="note-separator">·</span> 这里的每个人都能看到你分享的内容</div><div class="timeline" id="timeline" role="log" aria-label="聊天消息" aria-live="polite"><button class="load-more" id="load-more" hidden>加载更早的消息</button><div class="welcome" id="welcome"><div class="welcome-symbol">≋</div><h2>这一刻，我们同频。</h2><p>不用介绍自己，先说声你好吧。</p><span>一个网络 · 一个聊天室</span></div><div id="messages"></div></div><button class="new-messages" id="new-messages" hidden>有新消息 ↓</button><div class="composer-wrap"><div class="error" role="alert" id="error" hidden></div><div class="upload-progress" id="upload-progress" hidden><span id="upload-label"></span><progress id="upload-meter" max="100" value="0"></progress><button id="cancel-upload" type="button">取消</button></div><form id="composer"><textarea id="input" rows="1" maxlength="4000" placeholder="发条消息，加入聊天…" aria-label="消息内容" disabled></textarea><div class="composer-bottom"><span>Enter 发送 <b>·</b> Shift + Enter 换行</span><div class="composer-actions"><input id="file-input" type="file" hidden disabled><button id="attach" type="button" disabled aria-label="上传文件" title="上传文件，最大 500 MB">＋ <span>文件</span></button><button id="send" type="submit" disabled>发送 <span>↑</span></button></div></div></form><div class="footer-note">无需登录，自由交流 · 文件最大 500 MB<span id="length">0 / 4000</span></div></div></section></main></body></html>
